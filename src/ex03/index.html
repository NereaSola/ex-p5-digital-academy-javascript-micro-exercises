<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main class="container">
        <section class="number-checker">
            <h1 class="number-checker__title">Highest Number Finder</h1>
            <p class="number-checker__description">Enter three numbers to find out which one is the largest.</p>
            
            <form class="number-checker__form" id="checkerForm">
                <div class="number-checker__field">
                    <label for="num1" class="number-checker__label">First Number:</label>
                    <input type="number" id="num1" class="number-checker__input" required>
                </div>
                <div class="number-checker__field">
                    <label for="num2" class="number-checker__label">Second Number:</label>
                    <input type="number" id="num2" class="number-checker__input" required>
                </div>
                <div class="number-checker__field">
                    <label for="num3" class="number-checker__label">Third Number:</label>
                    <input type="number" id="num3" class="number-checker__input" required>
                </div>
                <button type="submit" class="number-checker__button">Calculate</button>
            </form>

            <div class="number-checker__result number-checker__result--hidden" id="resultContainer">
                <p class="number-checker__result-text">The largest number is: <span id="largestValue" class="number-checker__highlight"></span></p>
            </div>
        </section>
    </main>
    <script type="module" src="./app.js"></script>
</body>
</html>
